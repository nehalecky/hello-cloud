site_name: hello cloud
site_url: https://nehalecky.github.io/hello-cloud
repo_url: https://github.com/nehalecky/hello-cloud
repo_name: nehalecky/hello-cloud

theme:
  name: material
  logo: _assets/images/logo-icon-header.png
  favicon: _assets/images/favicon.ico

  # Foundation Horizon Brand Identity
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  # Typography - FastAPI/Pydantic style
  font:
    text: Roboto
    code: Roboto Mono

  # Table of contents title
  toc_title: "Page contents"

  # Modern features - Starlette-inspired (2D navigation)
  features:
    # Navigation
    - navigation.instant          # Instant loading (SPA-like)
    - navigation.instant.prefetch # Prefetch pages on hover
    - navigation.instant.progress # Loading progress indicator
    - navigation.tracking         # URL updates with scroll
    - navigation.path             # Breadcrumb path
    - navigation.indexes          # Section index pages
    - navigation.top              # Back to top button
    - navigation.footer           # Previous/next footer navigation

    # Search enhancements
    - search.suggest              # Search suggestions
    - search.highlight            # Highlight search terms
    - search.share                # Share search results

    # Content features
    - content.code.copy           # Copy button on code blocks
    - content.code.annotate       # Code annotations
    - content.tabs.link           # Link content tabs

    # Table of contents
    - toc.follow                  # TOC follows scroll

  icon:
    repo: fontawesome/brands/github

# Custom CSS for Foundation Horizon colors
extra_css:
  - _assets/stylesheets/brand.css

# Enable MathJax for LaTeX math rendering
extra_javascript:
  - _assets/javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - TimeSeries Quickstart: notebooks/06_quickstart_timeseries_loader.ipynb
  - Tutorials:
      - tutorials/index.md
      - Workload Signatures: notebooks/02_guide_workload_signatures_guide.ipynb
      - Gaussian Process Modeling: notebooks/04_modeling_gaussian_process.ipynb
      - IOPS Analysis: notebooks/03_EDA_iops_web_server.ipynb
      - PiedPiper Data Analysis: notebooks/05_EDA_piedpiper_data.ipynb
      - Forecasting Comparison: notebooks/07_forecasting_comparison.ipynb
  - Research:
      - research/index.md
      - Cloud Resource Patterns: research/cloud-resource-patterns-research.md
      - Metrics Correlations: research/cloud-resource-correlations-report.md
      - Anomaly Datasets Review: research/timeseries-anomaly-datasets-review.md
      - TimesFM Evaluation: research/opentslm-foundation-model-evaluation.md
      - Gaussian Process Design: research/gaussian-process-design.md
  - API Reference:
      - reference/index.md
  - Contributing:
      - contributing/index.md
      - Code Quality: contributing/code-quality.md
      - Formatting Examples: contributing/formatting-examples.md
