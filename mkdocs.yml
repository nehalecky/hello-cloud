site_name: Hello Cloud
site_url: https://nehalecky.github.io/hello-cloud
repo_url: https://github.com/nehalecky/hello-cloud

theme:
  name: material

  # Foundation Horizon Brand Identity
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  # Typography - FastAPI/Pydantic style
  font:
    text: Roboto
    code: Roboto Mono

  # Modern features - FastAPI/Pydantic inspired
  features:
    # Navigation
    - navigation.instant          # Instant loading (SPA-like)
    - navigation.instant.prefetch # Prefetch pages on hover
    - navigation.instant.progress # Loading progress indicator
    - navigation.tracking         # URL updates with scroll
    - navigation.tabs             # Top-level tabs
    - navigation.tabs.sticky      # Sticky tabs on scroll
    - navigation.path             # Breadcrumb path
    - navigation.indexes          # Section index pages
    - navigation.top              # Back to top button
    - navigation.footer           # Previous/next footer navigation

    # Search enhancements
    - search.suggest              # Search suggestions
    - search.highlight            # Highlight search terms
    - search.share                # Share search results

    # Content features
    - content.code.copy           # Copy button on code blocks
    - content.code.annotate       # Code annotations
    - content.tabs.link           # Link content tabs

    # Table of contents
    - toc.follow                  # TOC follows scroll
    - toc.integrate               # Integrate TOC into nav (optional)

  icon:
    repo: fontawesome/brands/github

# Custom CSS for Foundation Horizon colors
extra_css:
  - stylesheets/brand.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
  - mkdocs-jupyter:
      include_source: true
      execute: false

nav:
  - Home: index.md
  - Notebooks:
      - notebooks/index.md
      - Workload Signatures: notebooks/published/02_guide_workload_signatures_guide.ipynb
      - IOPS Analysis: notebooks/published/03_EDA_iops_web_server.ipynb
      - Gaussian Processes: notebooks/published/04_modeling_gaussian_process.ipynb
      - PiedPiper Data: notebooks/published/05_EDA_piedpiper_data.ipynb
      - TimeSeries Quickstart: notebooks/published/06_quickstart_timeseries_loader.ipynb
      - Forecasting: notebooks/published/07_forecasting_comparison.ipynb
  - Concepts:
      - concepts/index.md
      - Research:
          - concepts/research/cloud-resource-patterns-research.md
          - concepts/research/cloud-resource-correlations-report.md
          - concepts/research/timeseries-anomaly-datasets-review.md
          - concepts/research/opentslm-foundation-model-evaluation.md
      - Design:
          - concepts/design/gaussian-process-design.md
  - Reference:
      - reference/index.md
